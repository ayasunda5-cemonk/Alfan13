<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up! Happy Birthday</title>
    <!-- Import Font Pixel -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #111;
            --screen-bg: #000;
            --frame-color: #333;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Press Start 2P', cursive; /* Font pixel */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        /* Container Konsol */
        .console-container {
            width: 90%;
            max-width: 500px;
            background: var(--frame-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            border: 4px solid #555;
            position: relative;
        }

        /* Layar Game */
        .screen {
            background-color: var(--screen-bg);
            border: 4px solid #222;
            border-radius: 5px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Efek Garis Scanline TV Jadul */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Foto Profil */
        .photo-frame {
            width: 150px;
            height: 150px;
            border: 4px solid var(--neon-green);
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 50%; /* Lingkaran */
            animation: pulse 2s infinite;
            background-color: #222;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
        }

        p {
            font-size: 0.7rem;
            line-height: 1.6;
            color: #fff;
            margin-bottom: 20px;
        }

        /* Tombol Start */
        .start-btn {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            animation: blink 1s infinite;
        }

        .start-btn:hover {
            background: var(--neon-green);
            color: #000;
        }

        /* Konten Tersembunyi Awalnya */
        #game-content {
            display: none;
            z-index: 5;
        }

        /* Animasi */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(57, 255, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0); }
        }

        /* Spotify Embed Styling */
        .spotify-wrapper {
            margin-top: 20px;
            width: 100%;
            border-radius: 12px;
        }

        /* Dekorasi Tombol Konsol */
        .console-decor {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            color: #555;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="console-container">
        <div class="screen">
            <div class="scanlines"></div>

            <!-- Halaman Awal (Menu) -->
            <div id="menu-screen">
                <h1 style="margin-bottom: 30px;">PLAYER 1 READY?</h1>
                <button class="start-btn" onclick="startGame()">PRESS START</button>
            </div>

            <!-- Halaman Ucapan (Gameplay) -->
            <div id="game-content">
                <div class="photo-frame">
                    <!-- GANTI 'foto.jpg' DENGAN NAMA FILE FOTO KAMU -->
                    <!-- Jika belum ada foto, pakai placeholder ini dulu -->
                    <img src="foto.png" alt="Foto Ulang Tahun" onerror="this.src='https://via.placeholder.com/150/000000/39ff14?text=FOTO+DISINI'">
                </div>

                <h1>HAPPY BIRTHDAY!</h1>
                <p>LEVEL 13 UNLOCKED<br>ACHIEVEMENT GET!</p>
                
                <div class="spotify-wrapper">
                    <!-- EMBED SPOTIFY JAMBRUD - SELAMAT ULANG TAHUN -->
                    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/5nJ5kXlLjZzZzZzZzZzZzZ?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
                
                <p style="margin-top:15px; color:var(--neon-green)">>> INSERT COIN TO CONTINUE...</p>
            </div>
        </div>

        <!-- Hiasan Bawah Konsol -->
        <div class="console-decor">
            <span>&#9670; &#9670; &#9670;</span> <!-- Simbol D-Pad -->
            <span>O X</span> <!-- Simbol Tombol Aksi -->
        </div>
    </div>

    <script>
        function startGame() {
            // Sembunyikan menu, tampilkan konten
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-content').style.display = 'block';

            // Mencoba memutar musik via iframe spotify (terbatas)
            // Karena batasan browser, user mungkin perlu klik play manual di widget spotify
            // Tapi visual sudah berubah menjadi mode "Party"
            
            // Efek suara koin (opsional, visual saja di sini)
            console.log("Coin Inserted!");
        }
    </script>
</body>
</html>
